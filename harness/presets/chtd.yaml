# CHTD's co-harness track: the frozen recipe both the teacher and the student run.
#
# The reason this file is frozen is the reason the experiment exists. A distillation result is only
# attributable to the model if everything else was identical, so "identical" cannot be a judgement
# call made per edit - it is a hash. Teacher and student sessions record the resolved preset hash in
# the append-only ledger, and CHTD refuses to compare two runs whose hashes differ.
#
# This file does not extend `minimal-rl`. That baseline is deliberately not extendable: a preset
# that extended it would change what it measures while still being called by its name. CHTD states
# every field explicitly for the same reason minimal-rl does, and freezes its own bytes.
#
# Every line says who reads it. Several keys have no reader today; they are kept because stating the
# whole intent of the track is the point, and a reader must not believe an unread key is in force.
name: chtd
# NOT CONSUMED. No code reads `surfaces`; which surfaces may select a recipe is a Profile decision.
surfaces: [cli, sdk]
# route/prompt_sections: read by core's readPreset and host's route materialization. `default` on
# both fields of a target is the unconfigured sentinel - the deployment's adapter list decides, which
# is what lets the same track run under a teacher adapter and a student adapter and stay one track.
# An empty prompt_sections is load-bearing here: no persona, no doctrine, no environment. Any text
# added here would enter both trajectories and stop the difference between them being the model.
model: { contract_id: null, route: { primary: { route: default, model: default } }, prompt_sections: [] }
# Read by core's readPreset. `standard` means the model emits tool calls directly.
disclosure: standard
# tools.core: NOT CONSUMED. The tool registry is filled by the extensions the assembly loads, not by
# this list; it states the intent of a two-tool track, and nothing enforces it yet. That gap matters
# for CHTD and is recorded rather than papered over: if the deployed assembly ships more tools than
# this line names, both models see them, so the comparison survives - the track is merely wider than
# declared.
# tools.timeout_ms: read by core's readPreset.
tools: { core: [shell, edit], timeout_ms: 120000 }
# NOT CONSUMED. No MCP client reads this yet. An empty server list is the intent: an MCP server
# added on one side only would break co-harness.
mcp: { servers: [], defer: false }
# NOT CONSUMED. Nothing loads skills from a root list yet; the empty list is the intent.
skills_roots: []
# Read by core's readPreset, all four fields.
compaction: { enabled: true, reserve_tokens: 16384, keep_recent_tokens: 20000, agent_callable: false }
# preflight / per_request_cap / on_exceed / max_steps: read by core's readPreset.
# attribution: NOT CONSUMED.
# max_steps is an experiment parameter, not a preference: it bounds how long a trajectory can be,
# and therefore how many decision points are comparable. 60 is chosen to admit multi-step work while
# keeping the tail short enough that divergent runs stay alignable; changing it changes the
# experiment and requires re-freezing.
budget: { preflight: estimate, per_request_cap: null, on_exceed: quote, max_steps: 60, attribution: own }
# on_unavailable and timeout_ms: read by core's readPreset, and on_unavailable again by base's
# approval seam. command_policy: validated by the host when a session opens and evaluated by base's
# approval seam.
#
# WHY THIS TABLE IS NO LONGER EMPTY, AND WHAT IT COST.
#
# It was empty, on the reasoning that "a rule table here would have to name absolute paths, which
# differ per machine and would defeat the byte freeze" - correct about the paths, and incomplete
# about the consequence. `read` declares `requiresApproval: 'never'`, so a task that only reads runs
# fine; `edit`, `write` and `shell` are all destructive, so an empty table sends every repair and
# every check to a human. A collection round has no human. Measured on the first error-recovery
# round: the teacher's opening `shell pwd && ls -la` came back `approval/decided verdict=rejected
# reason=user_rejected`, and the run was dead at step 1. Both arms failed every task - not because of
# the models, which is what it would have looked like in the data.
#
# So the table pre-approves the three tools a repair needs. The patterns are `.*` because the
# mechanism leaves no narrower choice: `normalizeArgv` reduces a path tool's argv to the *absolute,
# containment-checked* path, so any rule naming a path names one machine. Containment is therefore
# enforced by the harness - a path outside the workspace is refused before a rule is consulted - and
# not by this table. For `shell` the argv is the normalised command line and `.*` admits any of
# them; that is the widest thing this change does, and it is stated rather than implied.
#
# What is preserved is the property the experiment rests on: there is one track, and both arms run
# it byte for byte. What is given up is that a destructive call reaches a human. A round is
# unattended by design, so "reaches a human" meant "is refused", and a track that refuses every
# repair cannot measure error recovery.
approval:
  on_unavailable: deny
  timeout_ms: 60000
  command_policy:
    - { tool: "shell", argv: ".*", action: allow }
    - { tool: "edit", argv: ".*", action: allow }
    - { tool: "write", argv: ".*", action: allow }
# required: read by the host, which refuses to open a session when the platform cannot provide L1.
# on_unavailable: read by core's readPreset. level: read by base's sandbox seam
# (packages/base/extensions/sandbox/src/policy.ts, readSandboxConfig), which refuses a level other
# than L0 or L1 — so this is a live knob, not a comment.
sandbox: { level: L1, required: false, on_unavailable: deny }
# Read by core's readPreset as the depth limit. 0 means this track spawns no subagents: a subagent
# would run its own trajectory and put decisions in it that neither teacher nor student produced,
# which is exactly the contamination the track exists to remove.
subagent: { max_depth: 0 }
# Read by core's readPreset.
verifier: { default_tier: 0 }
# enabled: NOT CONSUMED. readPreset reads completion_gate.min_items and nothing else.
completion_gate: { enabled: false }
# NOT CONSUMED. No self-refinement loop reads this yet; `false` is the intent for a baseline.
harness: { auto_refine: { enabled: false } }
# consent: read by host's readTelemetryConsent (packages/host/src/session-hooks.ts), which refuses
# a value outside DISABLED/LOCAL/ANON/FULL — so this is a live knob too. invariants and timing are
# read by core's readPreset; neither is written here, so both take their defaults of false.
# DISABLED is the stated intent.
telemetry: { consent: DISABLED }
# NOT CONSUMED. Hook subscription comes from the extensions the assembly loads. A hook that fired on
# one side only would be a harness difference wearing the model's name.
hooks: []
# NOT CONSUMED.
locale: en
